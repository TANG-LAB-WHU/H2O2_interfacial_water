# =============================================================================
# Docker Compose configuration for water-PDMS interface production AIMD
# =============================================================================
# Purpose: Run LAMMPS with MACE ML force field for water-PDMS interface production AIMD
#
# Services:
#   - mace_model_conversion: Convert MACE model to MLIAP format
#   - lammps_aimd: Run production AIMD simulation
# =============================================================================

services:
  # Base service configuration
  base:
    # image: mylammps_rtx5080:full_features_mlip_aimd_cuequ
    image: mylammps_rtx5080:full_features_mlip_aimd_cuequ_imp
    working_dir: /workspace
    # shm_size: '16gb'
    volumes:
      - .:/workspace
    environment:
      - PYTHONPATH=/workspace
      - TORCH_FORCE_NO_WEIGHTS_ONLY_LOAD=1
      - PYTORCH_ALLOC_CONF=expandable_segments:True
      - OMP_NUM_THREADS=1
      - OMP_PROC_BIND=spread
      - OMP_PLACES=threads
      - NVIDIA_DRIVER_CAPABILITIES=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Service for MACE model automated download
  mace_model_download:
    extends: base
    container_name: mace_model_download
    entrypoint: ["python3", "/workspace/mace_pretained_models/download_mace_model.py"]

  # Service for MACE model conversion to MLIAP format
  # Allows full command override during `docker compose run`
  mace_model_conversion:
    extends: base
    container_name: mace_model_conversion
    command: ["python3", "/workspace/convert_mace_to_mliap.py"]

  # Service for LAMMPS production AIMD simulation
  # Allows variable override during `docker compose run`
  lammps_aimd:
    extends: base
    container_name: lammps_aimd
    command: ["bash", "-c", "lmp -k on g 1 -sf kk -pk kokkos neigh half newton on -in run_AIMD.inp"]

